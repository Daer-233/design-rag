[project]
name = "design-rag"
version = "0.1.0"
description = "Design case RAG system"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
pythonpath = ["apps/backend", "apps/embedding", "apps/rerank"]
testpaths = ["apps/backend/tests", "apps/embedding/tests", "apps/rerank/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
