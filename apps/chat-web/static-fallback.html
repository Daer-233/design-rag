<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Design_RAG Agent</title><style>
:root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#203a31;background:#f6f8f6}*{box-sizing:border-box}body{margin:0;min-width:960px}.app{height:100vh;display:grid;grid-template-columns:255px minmax(480px,1fr) 310px;overflow:hidden}.sidebar{padding:22px 15px;background:#183e34;color:#effaf3;display:flex;flex-direction:column;gap:16px}.brand{padding:4px 8px 14px;border-bottom:1px solid #ffffff24}.brand small,.eyebrow{color:#9fc7b0;letter-spacing:.12em;font-weight:700;font-size:11px}.brand h1{font-size:21px;margin:6px 0}.brand p{margin:0;color:#c5d9cd;font-size:12px;line-height:1.6}.new-btn,.send{background:#58ab78;border:0;color:#fff;border-radius:10px;font-weight:700;padding:11px;cursor:pointer}.new-btn:disabled,.send:disabled{opacity:.6;cursor:not-allowed}.project-label{font-size:11px;color:#b6d1c0}.project-select{width:100%;background:#214c40;color:#eaf5ed;border:1px solid #427163;border-radius:8px;padding:9px}.list{overflow:auto;display:grid;gap:5px}.conversation{background:transparent;border:0;border-radius:9px;text-align:left;color:#d9ece0;padding:10px;cursor:pointer}.conversation:hover,.conversation.active{background:#2b5a4d}.conversation strong,.conversation span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.conversation strong{font-size:13px}.conversation span{font-size:11px;color:#a9c7b7;margin-top:4px}.sidebar-footer{margin-top:auto;display:grid;gap:13px}.hint{color:#a6c1b1;font-size:11px;line-height:1.55;padding:8px}.ai-switch-link{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;gap:10px;min-height:58px;padding:9px 10px;border:1px solid #e8fffa8f;border-radius:13px;color:#fff;text-decoration:none;background:linear-gradient(120deg,#6346e7,#0588d8,#09af9d,#ed55ab,#7b4fe7);background-size:260% 260%;box-shadow:0 9px 22px #0314113d,inset 0 1px #ffffff47;animation:flow 8s ease infinite}.ai-switch-link:before{content:"";position:absolute;z-index:-1;inset:-70%;opacity:.58;background:conic-gradient(from 90deg,transparent,#ffffffbf,transparent 28%);animation:orbit 5s linear infinite}.ai-switch-link:hover{color:#fff;transform:translateY(-2px) scale(1.01)}.ai-switch-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#fff3;font-size:19px;text-shadow:0 0 12px #fffc;animation:spark 1.7s ease-in-out infinite alternate}.ai-switch-copy{display:grid;gap:2px}.ai-switch-copy small{color:#fffb;font-size:8px;font-weight:800;letter-spacing:1.1px}.ai-switch-copy strong{font-size:12px}.ai-switch-arrow{margin-left:auto;font-size:17px;font-weight:800}.main{display:grid;grid-template-rows:auto 1fr auto;background:#fcfdfc;min-width:0}.topbar{padding:19px 30px;border-bottom:1px solid #e2eae4;display:flex;align-items:center;justify-content:space-between}.topbar h2{margin:2px 0 0;color:#284b3e;font-size:19px}.status{font-size:12px;color:#387d58;background:#e3f4e8;border-radius:99px;padding:6px 9px}.messages{padding:26px 32px;overflow:auto}.empty{max-width:710px;margin:12vh auto;padding:28px;border:1px dashed #bed1c4;border-radius:16px;background:#f5fbf7;color:#536d61}.empty h3{margin:0 0 9px;color:#2e5e49}.message{display:flex;gap:10px;margin:0 0 23px;max-width:790px}.message.user{flex-direction:row-reverse;margin-left:auto}.avatar{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;background:#dcefe3;color:#2d7250;font-size:12px;font-weight:800}.user .avatar{background:#255846;color:#fff}.bubble{max-width:78%}.meta{margin:0 0 6px;font-size:12px;color:#82948b}.meta strong{color:#385b4c}.text{white-space:pre-wrap;line-height:1.75;background:#eff6f1;padding:12px 14px;border-radius:3px 14px 14px 14px;font-size:14px}.user .text{background:#255846;color:#fff;border-radius:14px 3px 14px 14px}.composer-wrap{padding:0 30px 24px}.composer{border:1px solid #c9dbd0;border-radius:15px;background:#fff;box-shadow:0 8px 25px #214a3914}textarea{width:100%;border:0;outline:0;resize:none;padding:15px 16px 6px;min-height:78px;font:inherit;color:#203a31}.composer-actions{display:flex;align-items:center;justify-content:space-between;padding:7px 10px 10px 16px;color:#84958c;font-size:11px}.workflow{background:#f0f5f1;border-left:1px solid #dce7df;padding:17px;overflow:auto}.workflow h3{font-size:19px;margin:6px 0}.workflow p{font-size:12px;color:#73867c;line-height:1.55}.event{display:flex;gap:9px;padding:0 0 13px}.dot{width:10px;height:10px;border-radius:50%;background:#55a477;margin-top:5px}.event strong{font-size:12px;color:#375a4b}.event div div{font-size:11px;line-height:1.5;color:#778a80;margin-top:3px}@keyframes flow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}@keyframes orbit{to{transform:rotate(1turn)}}@keyframes spark{to{transform:scale(1.16) rotate(12deg)}}@media(prefers-reduced-motion:reduce){.ai-switch-link,.ai-switch-link:before,.ai-switch-icon{animation:none}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><small>DESIGN_RAG</small><h1>Agent 工作台</h1><p>匿名本地会话 · 仅展示执行过程与推理摘要</p></div><button id="newChat" class="new-btn">＋ 新建对话</button><label class="project-label">限定项目（可选）<select id="project" class="project-select"><option value="">全部已授权项目</option></select></label><div id="conversations" class="list"></div><div class="sidebar-footer"><a id="adminLink" class="ai-switch-link" href="../admin/" aria-label="前往知识库管理后台"><span class="ai-switch-icon">✦</span><span class="ai-switch-copy"><small>KNOWLEDGE BASE</small><strong>进入知识库管理</strong></span><span class="ai-switch-arrow">↗</span></a><div class="hint">同一浏览器 Cookie 仅能看到自己的匿名对话。未使用 IP 作为身份。</div></div></aside><main class="main"><header class="topbar"><div><div class="eyebrow">LOCAL RAG AGENT</div><h2 id="chatTitle">新对话</h2></div><span id="status" class="status">正在连接 Backend</span></header><section id="messages" class="messages"><div class="empty"><h3>开始一段设计问答</h3><p>可询问设计方案、材料、空间及已授权项目资料。</p></div></section><form id="composer" class="composer-wrap"><div class="composer"><textarea id="question" placeholder="输入问题，Enter 发送，Shift + Enter 换行"></textarea><div class="composer-actions"><span>仅基于授权项目资料回答</span><button id="send" class="send">发送 ↗</button></div></div></form></main><aside class="workflow"><div class="eyebrow">AGENT WORKFLOW</div><h3>本轮执行过程</h3><p>显示可解释执行摘要，不显示模型隐藏推理。</p><div id="workflow"></div></aside></div><script>
(()=>{const $=id=>document.getElementById(id),s={items:[],current:null,messages:[],events:[]},lab={'run.started':'已接收问题','workflow.node_started':'开始执行','workflow.node_completed':'执行完成','intent.completed':'意图识别','rewrite.completed':'问题重构','retrieval.started':'知识库检索','retrieval.completed':'检索与排序','answer.completed':'回答完成','run.completed':'工作流完成','run.error':'工作流异常'};if((location.hostname==='127.0.0.1'||location.hostname==='localhost')&&location.port==='5174')$('adminLink').href=`${location.protocol}//${location.hostname}:5173/admin/`;const esc=x=>String(x||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));async function api(p,o={}){const r=await fetch(p,{credentials:'include',headers:{Accept:'application/json',...(o.headers||{})},...o}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||`请求失败（HTTP ${r.status}）`);return d}function draw(){let list=$('conversations');list.innerHTML=s.items.map(x=>`<button class="conversation ${x.id===s.current?.id?'active':''}" data-id="${x.id}"><strong>${esc(x.title||'新对话')}</strong><span>${esc(x.last_message||'开始一段新的对话')}</span></button>`).join('');list.querySelectorAll('button').forEach(b=>b.onclick=()=>open(b.dataset.id));$('chatTitle').textContent=s.current?.title||'新对话';$('messages').innerHTML=s.messages.length?s.messages.map(m=>`<article class="message ${m.role==='user'?'user':''}"><div class="avatar">${m.role==='user'?'你':'DR'}</div><div class="bubble"><div class="meta"><strong>${m.role==='user'?'你':'Design_RAG Agent'}</strong></div><div class="text">${esc(m.content||'正在生成回答')}</div></div></article>`).join(''):'<div class="empty"><h3>开始一段设计问答</h3><p>可询问设计方案、材料、空间及已授权项目资料。</p></div>';$('workflow').innerHTML=s.events.map(e=>`<div class="event"><span class="dot"></span><div><strong>${esc(lab[e.type]||e.type)}</strong><div>${esc(e.p?.summary||'正在处理…')}</div></div></div>`).join('')||'<p>发送问题后将在这里显示流程。</p>'}async function refresh(){s.items=(await api('/api/v1/agent/conversations')).items||[];draw()}async function open(id){let d=await api('/api/v1/agent/conversations/'+id);s.current=d.conversation;s.messages=d.messages||[];s.events=[];draw()}async function create(){let d=await api('/api/v1/agent/conversations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project_id:$('project').value||null})});await refresh();await open(d.conversation.id)}async function send(q){if(!s.current)await create();s.messages.push({role:'user',content:q},{role:'assistant',content:''});s.events=[];draw();let d=await api(`/api/v1/agent/conversations/${s.current.id}/runs`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,project_id:$('project').value||null,request_id:crypto.randomUUID?.()||String(Date.now())})}),es=new EventSource(`/api/v1/agent/runs/${d.run.id}/events`,{withCredentials:true});$('send').disabled=true;['run.started','workflow.node_started','workflow.node_completed','intent.completed','rewrite.completed','retrieval.started','retrieval.completed','answer.token','answer.citation','answer.completed','run.completed','run.error','run.cancelled'].forEach(t=>es.addEventListener(t,e=>{let record={};try{record=JSON.parse(e.data)}catch{};const payload=record&&typeof record.payload==='object'&&record.payload?record.payload:{};if(t==='answer.token'){const assistant=s.messages.at(-1);if(assistant)assistant.content+=payload.text||''}else s.events.push({type:t,p:payload});draw();if(['run.completed','run.error','run.cancelled'].includes(t)){es.close();$('send').disabled=false;refresh().then(()=>open(s.current.id))}}));es.onerror=()=>{$('send').disabled=false;es.close()}}async function init(){try{await api('/api/v1/agent/session');$('status').textContent='Backend 已连接';let p=await api('/api/v1/admin/projects');for(const x of p.items||[]){let o=document.createElement('option');o.value=x.id;o.textContent=x.name||x.id;$('project').append(o)}await refresh();s.items[0]?await open(s.items[0].id):await create()}catch(e){$('status').textContent='Backend 未连接'}}$('newChat').onclick=create;$('composer').onsubmit=e=>{e.preventDefault();let q=$('question').value.trim();if(q&&!$('send').disabled){$('question').value='';send(q)}};init()})()
</script></body></html>
