<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工作知识助手</title><link rel="stylesheet" href="/knowledge/style.css"></head>
<body><div id="app">
<aside class="sidebar"><div class="brand"><span class="monogram">K.</span><div>工作知识助手<small>WORK KNOWLEDGE ASSISTANT</small></div></div><button id="new" class="primary">＋ 新建知识资料</button><div class="nav-heading">资料分类 <button id="add-category" class="quiet" aria-label="新增分类">＋</button></div><nav id="categories" class="scroll"></nav><div class="sidebar-foot"><span class="dot"></span> 本机独立资料库<small>IT · 入职 · 财务 · 运营</small></div></aside>
<section class="catalog"><header><div class="eyebrow">LIBRARY</div><h1>让工作问题，有据可查。</h1><p>收集 IT、入职、财务与运营知识，保留说明、配图与来源。</p><input id="filter" placeholder="筛选资料标题、适用对象或版本" aria-label="筛选资料"></header><div class="list-heading"><span id="list-label">全部资料</span><span id="count"></span></div><div id="entries" class="entry-list scroll"></div></section>
<main class="workspace"><header class="workspace-head"><div><span class="eyebrow">REFERENCE DESK</span><h2>知识与来源</h2></div><button id="scope" class="quiet" title="显示或隐藏资料列表">切换目录</button></header><div id="notice" role="status" hidden></div><div id="reading" class="reading scroll"><div class="welcome"><span class="welcome-label">让日常工作更顺手</span><h2>找到答案，<br>也找到它的依据。</h2><p>在下方提问，或选择一份知识资料。相关说明、操作配图与原文来源会一起出现。</p><div class="hints"><button data-question="如何整理和发布知识资料？">如何整理和发布知识资料？ ↗</button><button data-question="如何为操作步骤添加截图？">如何为操作步骤添加截图？ ↗</button></div></div></div><form id="ask" class="composer"><div class="composer-options"><label><input type="checkbox" id="only-current"> 只查当前资料</label><input id="product-filter" placeholder="适用系统 / 对象（可选）" aria-label="限定适用系统或对象"><input id="version-filter" placeholder="版本（可选）" aria-label="限定版本"></div><div class="composer-line"><textarea id="question" rows="2" required placeholder="例如：新员工如何申请 VPN？" aria-label="工作知识问题"></textarea><button class="primary" id="ask-button" type="submit">查找答案 ↗</button></div><small>这里预览检索证据 · 最终回答由 LangBot 的 Codex 处理器生成 · 截图识别需单独确认</small></form></main>
</div><dialog id="editor"><form method="dialog" class="dialog-top"><div><span class="eyebrow">ADD A REFERENCE</span><h2 id="editor-title">新建知识资料</h2></div><button class="quiet" aria-label="关闭">关闭 ×</button></form><div id="editor-body"></div></dialog><dialog id="image-dialog"><form method="dialog"><button>关闭 ×</button></form><img id="large-image" alt="资料原图"></dialog><script type="module" src="/knowledge/app.js"></script></body></html>
